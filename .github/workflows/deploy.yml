name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Дождаться завершения активного деплоя перед следующим выпуском.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kenniele/fitlog
  WEB_IMAGE: ghcr.io/kenniele/fitlog-web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./cmd/... ./internal/... ./migrations/...
      - run: go test -race -count=1 ./cmd/... ./internal/... ./migrations/...
      - run: bash -n deployments/release.sh
      - run: shellcheck deployments/release.sh
      - run: python3 -m unittest discover -s deployments -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Go image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Кэш слоёв храним в GitHub Actions, а не на сервере — VPS-диск не растёт.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Control Center image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile.web
          build-args: |
            FITLOG_API_INTERNAL_URL=http://fitlog-backend:8080
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          root="${DEPLOY_PATH:?set DEPLOY_PATH}"
          : "${SSH_KEY:?set DEPLOY_SSH_KEY}" "${SSH_HOST:?set DEPLOY_HOST}" "${SSH_USER:?set DEPLOY_USER}" "${SSH_KNOWN_HOSTS:?set verified DEPLOY_KNOWN_HOSTS}"
          [[ "$root" =~ ^/[a-zA-Z0-9_./-]+$ ]] && [[ "$root" != / ]]
          [[ "$port" =~ ^[0-9]+$ ]] && [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.:-]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          ssh_options=(-i ~/.ssh/id_deploy -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=3)
          remote="$SSH_USER@$SSH_HOST"
          incoming="$root/deploy/releases/$RELEASE_SHA"
          ssh "${ssh_options[@]}" "$remote" "mkdir -p '$incoming'"
          scp -i ~/.ssh/id_deploy -P "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deployments/compose.prod.yml deployments/release.sh "$remote:$incoming/"
          ssh "${ssh_options[@]}" "$remote" \
            "bash '$incoming/release.sh' '$root' '$IMAGE:$RELEASE_SHA' '$WEB_IMAGE:$RELEASE_SHA'"
