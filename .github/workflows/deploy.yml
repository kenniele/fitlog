name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Не запускать два деплоя одновременно; новый push отменяет предыдущий in-flight.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kenniele/fitlog

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Кэш слоёв храним в GitHub Actions, а не на сервере — VPS-диск не растёт.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/fitlog
          # Жёстко синхронизируемся с origin/main, чтобы локальный дрейф трекаемых
          # файлов не ломал деплой. .env в .gitignore — reset --hard его не трогает.
          git fetch origin main
          git reset --hard origin/main
          COMPOSE="docker compose -f deployments/docker-compose.yml -f deployments/docker-compose.prod.yml"
          $COMPOSE pull
          docker compose \
            --env-file /home/fitlog/fitlog/.env \
            -f deployments/docker-compose.yml \
            -f deployments/docker-compose.prod.yml \
            up -d --force-recreate app
          $COMPOSE logs --tail=20 app
          # Старый образ после обновления тега становится dangling — убираем.
          docker image prune -f || true
          REMOTE
