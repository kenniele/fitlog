name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Не запускать два деплоя одновременно; новый push отменяет предыдущий in-flight.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kenniele/fitlog
  WEB_IMAGE: ghcr.io/kenniele/fitlog-web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./cmd/... ./internal/... ./migrations/...
      - run: go test -race -count=1 ./cmd/... ./internal/... ./migrations/...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Go image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Кэш слоёв храним в GitHub Actions, а не на сервере — VPS-диск не растёт.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Control Center image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile.web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/fitlog
          # Жёстко синхронизируемся с origin/main, чтобы локальный дрейф трекаемых
          # файлов не ломал деплой. .env в .gitignore — reset --hard его не трогает.
          git fetch origin main
          git reset --hard origin/main
          COMPOSE="docker compose --env-file $PWD/.env -f deployments/docker-compose.yml -f deployments/docker-compose.prod.yml"
          $COMPOSE pull
          # The image embeds the SQL migrations. Apply them before starting the
          # new application version so code never runs against an old schema.
          $COMPOSE up -d --wait --wait-timeout 30 postgres
          # Do not let the one-off container consume the remaining SSH heredoc.
          # Without closed stdin, bash reaches EOF here and never recreates app.
          $COMPOSE run --rm --no-deps -T app migrate </dev/null
          $COMPOSE up -d --force-recreate app web caddy
          $COMPOSE logs --tail=20 app web caddy
          # Старый образ после обновления тега становится dangling — убираем.
          docker image prune -f || true
          REMOTE
