name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Не запускать два деплоя одновременно; новый push отменяет предыдущий in-flight.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Деплоим только реальные пушы в main и ручной запуск, не форк-PR.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/fitlog
          git pull --ff-only
          # Освобождаем место от прошлых сборок, иначе небольшой VPS-диск переполняется.
          docker image prune -f || true
          docker builder prune -f || true
          docker compose -f deployments/docker-compose.yml up -d --build
          docker compose -f deployments/docker-compose.yml logs --tail=20 app
          # Образ предыдущей версии стал dangling после пересборки — убираем.
          docker image prune -f || true
          REMOTE
