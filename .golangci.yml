run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - revive
    - gosec

linters-settings:
  gosec:
    excludes:
      - G104 # duplicated by errcheck
  revive:
    rules:
      - name: var-naming
      - name: exported
        disabled: true
  errorlint:
    errorf: true
    asserts: true
    comparison: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - bodyclose
  max-issues-per-linter: 0
  max-same-issues: 0
