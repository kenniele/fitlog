# Прод-оверлей: добавляет Caddy (TLS + reverse proxy перед app).
# Деплой запускает оба файла:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Локально этот файл НЕ подключается (make docker-up использует только базовый).
services:
  caddy:
    image: caddy:2-alpine
    container_name: fitlog-caddy
    restart: unless-stopped
    depends_on:
      - app
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
